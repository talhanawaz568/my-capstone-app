name: Build and Deploy 
on:
  push:
    branches: [main]
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-capstone-app:${{ steps.vars.outputs.sha_short }}
            ${{ secrets.DOCKERHUB_USERNAME }}/my-capstone-app:latest

      - name: Checkout configs repo
        uses: actions/checkout@v4
        with:
          repository: talha884/my-capstone-configs
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: configs-repo

      - name: Update dev image tag
        run: |
          cd configs-repo/overlays/dev
          sed -i "s|newTag: .*|newTag: ${{ steps.vars.outputs.sha_short }}|" kustomization.yaml

      - name: Commit and push config change
        run: |
          cd configs-repo
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Deploy ${{ steps.vars.outputs.sha_short }} to dev"
          git push
